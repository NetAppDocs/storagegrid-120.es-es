indexpage:
  title: "${post_edited_translations.segment}"
  summary: NetApp StorageGRID es una suite de almacenamiento de objetos definido por
    software que admite una amplia gama de casos de uso en entornos multicloud públicos,
    privados e híbridos. StorageGRID ofrece compatibilidad nativa con la API de Amazon
    S3 y aporta innovaciones líderes en el sector, como la gestión automatizada del
    ciclo de vida de los datos para almacenar, proteger y conservar datos no estructurados
    de forma rentable durante largos periodos de tiempo.
